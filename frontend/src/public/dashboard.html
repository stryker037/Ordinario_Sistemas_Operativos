<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Barra de Navegación -->
    <nav class="dashboard-navbar">
        <div class="nav-brand">
            <span>✓</span> Gestor de Tareas
        </div>
        <div class="nav-user-info">
            <span id="user-display-name" style="font-weight: 500;">Cargando...</span>
            <span id="user-role-badge" class="user-badge badge-normal">Normal</span>
            <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="dashboard-container">
        <div id="dashboard-grid" class="dashboard-grid">
            
            <!-- Panel Lateral de Administración (Oculto por defecto, visible para Admin) -->
            <aside id="admin-panel" class="panel" style="display: none;">
                <div class="panel-title">Administración</div>
                
                <!-- Registrar Usuario -->
                <div style="margin-bottom: 32px;">
                    <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--accent-blue-light);">Registrar Nuevo Usuario</h3>
                    <div id="user-alert" class="alert"></div>
                    <form id="create-user-form">
                        <div class="form-group">
                            <label for="new-username">Nombre de Usuario</label>
                            <input type="text" id="new-username" class="form-control" placeholder="Ej. juan" required>
                        </div>
                        <div class="form-group">
                            <label for="new-password">Contraseña</label>
                            <input type="password" id="new-password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="form-group">
                            <label for="new-role">Rol de Acceso</label>
                            <select id="new-role" class="form-control" required>
                                <option value="normal" selected>Normal</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">Registrar Usuario</button>
                    </form>
                </div>
                
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 24px;">
                
                <!-- Crear y Asignar Tarea -->
                <div>
                    <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--accent-blue-light);">Crear y Asignar Tarea</h3>
                    <div id="task-alert" class="alert"></div>
                    <form id="create-task-form">
                        <div class="form-group">
                            <label for="task-title">Título de Tarea</label>
                            <input type="text" id="task-title" class="form-control" placeholder="Ej. Redactar reporte" required>
                        </div>
                        <div class="form-group">
                            <label for="task-desc">Descripción</label>
                            <textarea id="task-desc" class="form-control" style="resize: vertical; min-height: 80px;" placeholder="Detalles de la tarea..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="task-assignee">Asignar A</label>
                            <select id="task-assignee" class="form-control" required>
                                <option value="" disabled selected>Selecciona un usuario</option>
                                <!-- Se llena dinámicamente -->
                            </select>
                        </div>
                        <button type="submit" class="btn">Crear Tarea</button>
                    </form>
                </div>
            </aside>

            <!-- Panel de Listado de Tareas (Visible para todos) -->
            <main class="panel">
                <div class="panel-title">
                    Mis Tareas Asignadas
                    <span id="task-count" class="count">0</span>
                </div>
                
                <div id="tasks-container" class="task-list">
                    <!-- Las tareas se cargan dinámicamente aquí -->
                    <div class="empty-state">Cargando tareas...</div>
                </div>
            </main>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
